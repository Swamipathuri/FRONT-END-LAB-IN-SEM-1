<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #eef2f7;
        }

        .admin-header {
            background: #172554;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .admin-nav {
            background: #1e3a8a;
            padding: 15px;
            text-align: center;
        }

        .admin-nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .dashboard {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #0001;
        }

        .stat-card h3 {
            color: #475569;
            margin-bottom: 12px;
        }

        .stat-card p {
            font-size: 26px;
            font-weight: bold;
            color: #1d4ed8;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px #0001;
        }

        .panel h2 {
            margin-bottom: 18px;
        }

        .panel input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .product-row {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #e2e8f0;
            padding: 15px 0;
        }

        .product-row img {
            width: 75px;
            height: 65px;
            object-fit: contain;
        }

        .product-info {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        #adminMessage {
            margin: 12px 0;
        }

        @media (max-width: 500px) {
            .product-row {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <header class="admin-header">
        <h1>ShopEasy Admin Dashboard</h1>
        <p>Manage your online store</p>
    </header>

    <nav class="admin-nav">
        <a href="index.html">Login</a>
        <a href="user.html">Shopping Website</a>
        <a href="admin.html">Dashboard</a>
    </nav>

    <main class="dashboard">

        <section class="welcome">
            <h2>Welcome, Administrator!</h2>
            <p>Manage products and monitor your store below.</p>
        </section>

        <section class="stats">
            <div class="stat-card">
                <h3>Total Products</h3>
                <p id="productCount">0</p>
            </div>

            <div class="stat-card">
                <h3>Store Name</h3>
                <p style="font-size:22px;">ShopEasy</p>
            </div>

            <div class="stat-card">
                <h3>Dashboard</h3>
                <p style="font-size:22px;">Active</p>
            </div>
        </section>

        <section class="panel">
            <h2>Add New Product</h2>

            <form id="productForm">
                <input
                    type="text"
                    id="productName"
                    placeholder="Product Name"
                    required
                >

                <input
                    type="number"
                    id="productPrice"
                    placeholder="Product Price (₹)"
                    min="1"
                    step="0.01"
                    required
                >

                <input
                    type="url"
                    id="productImage"
                    placeholder="Product Image URL"
                    required
                >

                <button class="add-btn" type="submit">
                    + Add Product
                </button>
            </form>

            <p id="adminMessage" role="status"></p>
        </section>

        <section class="panel">
            <h2>Manage Products</h2>
            <div id="productList"></div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 ShopEasy Admin Dashboard</p>
    </footer>

    <script src="script.js"></script>

    <script>
        function updateDashboard() {
            const products = getProducts();
            const list = document.getElementById("productList");

            document.getElementById("productCount").textContent =
                products.length;

            list.replaceChildren();

            if (products.length === 0) {
                list.textContent = "No products available. Add a product above.";
                return;
            }

            products.forEach(product => {
                const row = document.createElement("div");
                row.className = "product-row";

                const image = document.createElement("img");
                image.src = product.image;
                image.alt = product.name;

                const info = document.createElement("div");
                info.className = "product-info";

                const name = document.createElement("strong");
                name.textContent = product.name;

                const price = document.createElement("p");
                price.textContent = "₹" + product.price;

                info.append(name, price);

                const button = document.createElement("button");
                button.className = "delete-btn";
                button.textContent = "Delete";

                button.addEventListener("click", function () {
                    const updated = getProducts().filter(
                        item => item.id !== product.id
                    );

                    saveData("products", updated);
                    updateDashboard();
                    document.getElementById("adminMessage").textContent =
                        "Product deleted successfully.";
                });

                row.append(image, info, button);
                list.appendChild(row);
            });
        }

        updateDashboard();
    </script>

</body>
</html>
